# git-cliff configuration for p2pawn
# Changelog grouping + conventional-commit parsing. Version numbers themselves
# are computed by .github/workflows/release.yml (squash-merge subjects).

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Versions follow the [0.x convention] of cargo: breaking changes bump minor,
features bump minor, fixes bump patch.

[0.x convention]: https://doc.rust-lang.org/cargo/reference/manifest.html#the-version-field
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect = true
tag_pattern = "v[0-9].*"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
