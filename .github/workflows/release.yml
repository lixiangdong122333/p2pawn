# Release: when a PR is squash-merged into main, derive the next version from
# the merge commit's conventional-commit type, update Cargo.toml/CHANGELOG,
# tag, build all three platforms, and publish the GitHub Release -- all in
# one run (no nested-workflow triggering involved).

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GIT_CLIFF_VERSION: v2.14.1

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.versions.outputs.released }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-cliff
          # The bot commit below must be allowed to push to protected main.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Install git-cliff
        run: |
          set -euo pipefail
          # Install the prebuilt binary to /usr/local/bin so every later step
          # in this job can call it. Note: the release asset name omits the
          # "v" prefix of the tag.
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1
          sudo mv git-cliff /usr/local/bin/
          git-cliff --version

      - name: Compute next version
        id: versions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Last released version: prefer GitHub Releases (drafts included),
          # because lightweight tags only materialize when a release is
          # published. Fall back to git tags, then 0.0.0.
          LAST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            | sed -n 's/^.*\tv\([0-9][0-9.]*\)\t.*$/\1/p' | sort -V | tail -1 || true)"
          if [ -z "$LAST" ]; then
            LAST_TAG="$(git tag --sort=-v:refname | head -1 || true)"
            LAST="${LAST_TAG#v}"
          fi
          [ -n "$LAST" ] || LAST=0.0.0

          # The head commit is the squash-merge; its subject carries the PR's
          # conventional-commit title, e.g. "feat: add replay (#12)".
          SUBJECT="$(git log -1 --pretty=%s)"
          echo "merge commit subject: $SUBJECT"

          # Skip our own release commits so they never re-trigger a release.
          case "$SUBJECT" in
            "chore(release):"*) 
              echo "Release commit, skipping."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac

          # Breaking marker: a "!" before the ":" in the type part, or a
          # "BREAKING CHANGE:" footer in the body.
          if echo "$SUBJECT" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            BUMP=minor   # breaking on 0.x bumps minor
          elif git log -1 --pretty=%B | grep -q '^BREAKING CHANGE:'; then
            BUMP=minor
          elif echo "$SUBJECT" | grep -Eq '^feat([(:]|$)'; then
            BUMP=minor
          elif echo "$SUBJECT" | grep -Eq '^fix([(:]|$)'; then
            BUMP=patch
          elif git-cliff --config cliff.toml --unreleased --strip all | grep -q '[^[:space:]]'; then
            # chore/docs/etc with a non-empty changelog body: still worth a
            # patch release.
            BUMP=patch
          else
            echo "No release-worthy changes, skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST"
          if [ "$BUMP" = minor ]; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Next version: v$VERSION (bump=$BUMP, from: $SUBJECT, last: v$LAST)"

      - name: Update version in Cargo.toml / Cargo.lock
        if: steps.versions.outputs.released == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace --offline 2>/dev/null || true
          # Generate the changelog for this release into CHANGELOG.md.
          git-cliff --config cliff.toml --tag "v$VERSION" > CHANGELOG.md

      - name: Commit release files
        if: steps.versions.outputs.released == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.version }}"
          git config user.name "p2pawn-release-bot"
          git config user.email "13478917542@163.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push

      - name: Create GitHub Release (published, tag on the release commit)
        if: steps.versions.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          # Tag the release commit we just pushed (HEAD), so the tag and the
          # version bump live together. Release is published immediately;
          # assets are attached by the build jobs below.
          NOTES="$(git-cliff --config cliff.toml --tag "v$VERSION" --strip header)"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            --latest

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: p2pawn-x86_64-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: p2pawn-x86_64-linux-musl.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: p2pawn-aarch64-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          SRC="target/${{ matrix.target }}/release/p2pawn"
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          mkdir -p "dist/p2pawn-v$VERSION"
          cp "$SRC" "dist/p2pawn-v$VERSION/"
          cp README.md README.zh-CN.md LICENSE-MIT LICENSE-APACHE "dist/p2pawn-v$VERSION/"
          cd dist
          if [[ "${{ matrix.artifact }}" == *.zip ]]; then
            7z a "../${{ matrix.artifact }}" "p2pawn-v$VERSION"
          else
            tar czf "../${{ matrix.artifact }}" "p2pawn-v$VERSION"
          fi
          cd ..
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        # Matrix jobs upload concurrently; --clobber lets a retry overwrite
        # an asset that another job (or a previous attempt) already created.
        run: gh release upload "v$VERSION" "${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
