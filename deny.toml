# cargo-deny configuration: keep the dependency tree permissively licensed.
# `cargo deny check licenses` runs in CI on every PR.

[licenses]
version = 2
allow = [
  "MIT",
  "MIT OR Apache-2.0",
  "Apache-2.0 OR MIT",
  "Apache-2.0/MIT",
  "Apache-2.0",
  "0BSD OR MIT OR Apache-2.0",
  "BSD-2-Clause OR Apache-2.0 OR MIT",
  "MIT OR Apache-2.0 OR LGPL-2.1-or-later",
  "MIT OR BSD-3-Clause",
  "MIT OR Zlib OR Apache-2.0",
  "MIT OR MPL-2.0",
  "Unlicense OR MIT",
  "Zlib",
  "Zlib OR Apache-2.0 OR MIT",
  "MPL-2.0",
]
# Some crates express choices with parentheses or AND-clauses on Unicode data;
# the confidence threshold lets those known-good cases through.
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"

[advisories]
version = 2
yanked = "warn"
